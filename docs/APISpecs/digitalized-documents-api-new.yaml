openapi: 3.0.0
info:
  title: Digitalized Documents
  description: |
    API specifications for Digitalized Documents in the Dristi system.
    This API enables creation, update, search and eSign of digitalized documents produced during case proceedings.
    Corrected against DigitalizedDocumentsApiController as implemented today.
  version: "0.1.0"
  contact:
    name: Dristi Solutions Team
    email: support@dristisolutions.org

servers:
  - url: /digitalized-documents
    description: Digitalized Documents API Server

tags:
  - name: DigitalizedDocuments
    description: APIs to create, update, search and eSign digitalized documents.

paths:
  /v1/_create:
    post:
      tags:
        - DigitalizedDocuments
      summary: Create a new digitalized document
      description: |
        API to create a new digitalized document record in the system.
      requestBody:
        description: Details for the new digitalized document + RequestInfo meta data.
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/DigitalizedDocumentRequest'
        required: true
      responses:
        '200':
          description: Digitalized document created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DigitalizedDocumentResponse'
        '400':
          description: Creation failed
          content:
            '*/*':
              schema:
                $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: digitalizedDocumentRequest

  /v1/_update:
    post:
      tags:
        - DigitalizedDocuments
      summary: Update an existing digitalized document
      description: |
        API to update an existing digitalized document record.
      requestBody:
        description: Details for updating the digitalized document + RequestInfo meta data.
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/DigitalizedDocumentRequest'
        required: true
      responses:
        '200':
          description: Digitalized document updated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DigitalizedDocumentResponse'
        '400':
          description: Update failed
          content:
            '*/*':
              schema:
                $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: digitalizedDocumentRequest

  /v1/_search:
    post:
      tags:
        - DigitalizedDocuments
      summary: Search digitalized documents
      description: |
        API to search for digitalized documents based on various criteria.
      requestBody:
        description: Search criteria + RequestInfo meta data.
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/DigitalizedDocumentSearchRequest'
        required: true
      responses:
        '200':
          description: ResponseInfo with list of digitalized documents matching search criteria
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DigitalizedDocumentSearchResponse'
        '400':
          description: Search failed
          content:
            '*/*':
              schema:
                $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: digitalizedDocumentSearchRequest

  /v1/_getDigitalizedDocumentsToSign:
    post:
      tags:
        - DigitalizedDocuments
      summary: Get digitalized documents prepared for eSign
      description: |
        API to build the eSign request payload(s) for a set of digitalized documents identified by criteria.
      requestBody:
        description: Get digitalized documents to sign based on criteria
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/DigitalizedDocumentsToSignRequest'
        required: true
      responses:
        '200':
          description: Documents prepared for signing
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DigitalizedDocumentsToSignResponse'
        '400':
          description: Failed to prepare documents for signing
          content:
            '*/*':
              schema:
                $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: digitalizedDocumentsToSignRequest

  /v1/_updateSignedDigitalizedDocuments:
    post:
      tags:
        - DigitalizedDocuments
      summary: Update signed digitalized documents
      description: |
        API to upload the signed copies of digitalized documents and progress their workflow.
      requestBody:
        description: Update signed digitalized documents
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/UpdateSignedDigitalizedDocumentRequest'
        required: true
      responses:
        '200':
          description: Signed digitalized documents updated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UpdateSignedDigitalizedDocumentResponse'
        '400':
          description: Failed to update signed digitalized documents
          content:
            '*/*':
              schema:
                $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: updateSignedDigitalizedDocumentRequest

components:
  schemas:
    DigitalizedDocumentRequest:
      type: object
      required:
        - RequestInfo
        - digitalizedDocument
      properties:
        RequestInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/RequestInfo'
        digitalizedDocument:
          $ref: '#/components/schemas/DigitalizedDocument'
      x-codegen-request-body-name: digitalizedDocumentRequest

    DigitalizedDocumentResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/ResponseInfo'
        digitalizedDocument:
          $ref: '#/components/schemas/DigitalizedDocument'

    DigitalizedDocumentSearchRequest:
      type: object
      required:
        - RequestInfo
      properties:
        RequestInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/RequestInfo'
        criteria:
          $ref: '#/components/schemas/DigitalizedDocumentSearchCriteria'
        pagination:
          $ref: '#/components/schemas/Pagination'

    DigitalizedDocumentSearchCriteria:
      type: object
      required:
        - tenantId
      properties:
        id:
          type: string
          description: Filter by document ID
        documentNumber:
          type: string
          description: Filter by generated document number
        orderNumber:
          type: string
        orderItemId:
          type: string
        caseId:
          type: string
        caseFilingNumber:
          type: string
        type:
          $ref: '#/components/schemas/TypeEnum'
        status:
          type: string
        tenantId:
          type: string
          description: Tenant context
        courtId:
          type: string

    DigitalizedDocumentSearchResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/ResponseInfo'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DigitalizedDocument'
        pagination:
          $ref: '#/components/schemas/Pagination'
        totalCount:
          type: integer
          format: int32

    TypeEnum:
      type: string
      description: Type of the document (java enum constant names - no @JsonValue override, so uppercase names are serialized)
      enum:
        - PLEA
        - EXAMINATION_OF_ACCUSED
        - MEDIATION

    MediationDetails:
      type: object
      description: Details captured for mediation proceedings.
      properties:
        natureOfComplainant:
          type: string
        dateOfInstitution:
          type: integer
          format: int64
          description: Epoch milliseconds for date of institution
        caseStage:
          type: string
        pdfCreatedDate:
          type: integer
          format: int64
          description: Epoch milliseconds when the mediation PDF was created
        hearingDate:
          type: integer
          format: int64
          description: Epoch milliseconds for hearing date
        dateOfEndADR:
          type: integer
          format: int64
          description: Epoch milliseconds for end of ADR (alternate dispute resolution)
        mediationCentre:
          type: string
        partyDetails:
          type: array
          items:
            $ref: '#/components/schemas/MediationPartyDetails'

    MediationPartyDetails:
      type: object
      properties:
        partyType:
          type: string
          enum:
            - COMPLAINANT
            - RESPONDENT
        uniqueId:
          type: string
          description: user uuid of the party
        userUuid:
          type: string
        poaUuid:
          type: string
          description: Power-of-attorney holder uuid, if applicable
        mobileNumber:
          type: string
        partyName:
          type: string
        partyIndex:
          type: integer
          format: int32
        hasSigned:
          type: boolean
          description: Indicates whether this party has signed the mediation document.
        counselName:
          type: string

    PleaDetails:
      type: object
      description: Details captured for recording plea of the accused.
      properties:
        accusedName:
          type: string
        accusedUniqueId:
          type: string
        fatherName:
          type: string
        village:
          type: string
        taluk:
          type: string
        calling:
          type: string
        age:
          type: integer
          format: int32
        isChargesUnderstood:
          type: boolean
        pleadGuilty:
          type: boolean
        magistrateRemarks:
          type: string
        accusedMobileNumber:
          type: string

    ExaminationOfAccusedDetails:
      type: object
      description: Details captured during examination of the accused.
      properties:
        accusedName:
          type: string
        accusedUniqueId:
          type: string
          description: Unique identifier of the accused in the system
        examinationDescription:
          type: string
        accusedMobileNumber:
          type: string

    DigitalizedDocument:
      type: object
      description: A digitalized document entity captured during proceedings.
      required:
        - type
        - caseId
        - caseFilingNumber
        - tenantId
        - courtId
      properties:
        id:
          type: string
          description: Unique identifier for the digitalized document
        type:
          $ref: '#/components/schemas/TypeEnum'
        documentNumber:
          type: string
          description: IdGen formatted number for the digitalized document
        caseId:
          type: string
          description: Unique identifier of the case associated with this document
        caseFilingNumber:
          type: string
          description: Filing number of the case associated with this document
        shortenedUrl:
          type: string
          description: shortened url used to send in sms as a link
          example: https://dristi-kerala-dev.pucar.org/eus/shorturl?code=BZ90r
        orderNumber:
          type: string
          description: Order number associated with this document. Applicable only in Mediation
        orderItemId:
          type: string
          description: Order item identifier associated with this document. Applicable only in Mediation
        pleaDetails:
          $ref: '#/components/schemas/PleaDetails'
        examinationOfAccusedDetails:
          $ref: '#/components/schemas/ExaminationOfAccusedDetails'
        mediationDetails:
          $ref: '#/components/schemas/MediationDetails'
        additionalDetails:
          type: object
          additionalProperties: true
          description: Additional details related to the document
        auditDetails:
          $ref: '#/components/schemas/AuditDetails'
        workflow:
          $ref: '#/components/schemas/WorkflowObject'
        status:
          type: string
          description: Current status of the digitalized document (driven by the business-service workflow config, not a Java enum)
        documents:
          type: array
          description: documents related to the digitalized document, for example generated PDFs or attachments
          items:
            $ref: '#/components/schemas/Document'
        tenantId:
          type: string
          description: Tenant context for the document
        courtId:
          type: string
          description: Court ID for the document

    Document:
      type: object
      description: This object holds list of documents attached during the transaction for a property
      properties:
        id:
          type: string
          maxLength: 64
        documentType:
          type: string
        fileStore:
          type: string
        documentUid:
          type: string
          maxLength: 64
        additionalDetails:
          type: object
          additionalProperties: true
        documentName:
          type: string
        isActive:
          type: boolean
          default: true

    AuditDetails:
      type: object
      description: Collection of audit related fields used by most models
      properties:
        createdBy:
          type: string
        lastModifiedBy:
          type: string
        createdTime:
          type: integer
          format: int64
        lastModifiedTime:
          type: integer
          format: int64

    WorkflowObject:
      description: >-
        Extends the shared org.egov.common.contract.models.Workflow (external library, not defined
        in this service) adding one local field. # TODO: fields not fully expanded, verify base
        Workflow fields against org.egov.common.contract.models.Workflow in the egov-models shared library.
      allOf:
        - $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/Workflow'
        - type: object
          properties:
            additionalDetails:
              type: object
              additionalProperties: true

    Pagination:
      type: object
      description: Pagination details
      properties:
        limit:
          type: number
          format: double
          default: 10
          maximum: 100
        offSet:
          type: number
          format: double
          default: 0
        totalCount:
          type: number
          format: double
        sortBy:
          type: string
        order:
          type: string
          enum: [asc, desc]

    DigitalizedDocumentsToSignRequest:
      type: object
      properties:
        RequestInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/RequestInfo'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/DigitalizedDocumentsCriteria'

    DigitalizedDocumentsCriteria:
      type: object
      properties:
        documentNumber:
          type: string
        fileStoreId:
          type: string
        placeholder:
          type: string
          description: Placeholder text used by eSign coordinate service
        tenantId:
          type: string

    DigitalizedDocumentsToSignResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/ResponseInfo'
        documentList:
          type: array
          items:
            $ref: '#/components/schemas/DigitalizedDocumentToSign'

    DigitalizedDocumentToSign:
      type: object
      properties:
        documentNumber:
          type: string
        request:
          type: string
          description: Generated XML request payload for eSign

    UpdateSignedDigitalizedDocumentRequest:
      type: object
      properties:
        RequestInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/RequestInfo'
        signedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/SignedDigitalizedDocument'

    SignedDigitalizedDocument:
      type: object
      required:
        - documentNumber
        - signedDocumentData
        - signed
      properties:
        documentNumber:
          type: string
        signedDocumentData:
          type: string
          description: Base64 encoded signed PDF data
        signed:
          type: boolean
        tenantId:
          type: string
        errorMsg:
          type: string

    UpdateSignedDigitalizedDocumentResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/common-contract-update/Common%20Services/common-contract.yaml#/components/schemas/ResponseInfo'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DigitalizedDocument'
