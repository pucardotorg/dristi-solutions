openapi: 3.0.0

info:
  title: Application Service API
  description: DRISTI Application Service responsible for creation,
    update, search and workflow operations for court applications.
  version: 1.0.0

servers:
  - url: /application
    description: Application Service Base Path (server.servlet.context-path=/application)

tags:
  - name: Application
    description: Application lifecycle APIs

security:
  - bearerAuth: []

paths:

  /v1/create:
    post:
      tags: [Application]
      summary: Create application
      description: Details for the new application + RequestInfo meta data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
      responses:
        '200':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'

  /v1/update:
    post:
      tags: [Application]
      summary: Update application
      description: Details for the update application(s) + RequestInfo meta data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'

  /v1/search:
    post:
      tags: [Application]
      summary: Search applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'

  /v1/exists:
    post:
      tags: [Application]
      summary: Check if application exists
      description: Check if the application(s) exist. Can send in any one of the values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationExistsRequest'
      responses:
        '200':
          description: Exists response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationExistsResponse'

  /v1/addcomment:
    post:
      tags: [Application]
      summary: Add comment to application
      description: Details for the new application comment + RequestInfo meta data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationAddCommentRequest'
      responses:
        '200':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationAddCommentResponse'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # -------------------------------------------------
    # WRAPPER REQUESTS
    # -------------------------------------------------

    ApplicationRequest:
      type: object
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        application:
          $ref: '#/components/schemas/Application'

    ApplicationSearchRequest:
      type: object
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        criteria:
          $ref: '#/components/schemas/ApplicationCriteria'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ApplicationExistsRequest:
      type: object
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        applicationList:
          type: array
          description: can send in any one of the values per entry; Exists value will be populated with true or false
          items:
            $ref: '#/components/schemas/ApplicationExists'

    ApplicationAddCommentRequest:
      type: object
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        applicationAddComment:
          $ref: '#/components/schemas/ApplicationAddComment'

    # -------------------------------------------------
    # RESPONSES
    # -------------------------------------------------

    ApplicationResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        application:
          $ref: '#/components/schemas/Application'

    ApplicationListResponse:
      type: object
      description: This object holds information about the application List response
      properties:
        ResponseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        TotalCount:
          type: integer
          format: int32
        applicationList:
          type: array
          items:
            $ref: '#/components/schemas/Application'

    ApplicationExistsResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        applicationList:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationExists'

    ApplicationAddCommentResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        applicationAddComment:
          $ref: '#/components/schemas/ApplicationAddComment'

    # -------------------------------------------------
    # DOMAIN MODEL
    # -------------------------------------------------

    Application:
      type: object
      required:
        - tenantId
        - caseId
        - createdDate
        - applicationType
        - status
        - isActive
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          description: This is tenantId of the case
        caseId:
          type: string
          description: This is the caseId of the associated case
        courtId:
          type: string
        filingNumber:
          type: string
          description: the associated case
        cnrNumber:
          type: string
          description: The CNR number of the associated case. helps in faster search
        cmpNumber:
          type: string
        referenceId:
          type: string
          format: uuid
          description: could be the orderID due to which this application is filed, for example, application to revoke the penalty
        createdDate:
          type: integer
          format: int64
          description: the date on which the application was created (epoch millis)
        createdBy:
          type: string
          format: uuid
          description: ID of the person (lawyer) who created the application
        onBehalfOf:
          type: array
          items:
            type: string
            format: uuid
            description: ID of the users for whom the application has been raised
        asUser:
          type: string
        applicationCMPNumber:
          type: string
          description: number assigned to the application when status is pending approval
          example: CMP/1/2024
        applicationType:
          type: string
          description: Master Data ID from ApplicationType master
        applicationNumber:
          type: string
          minLength: 2
          maxLength: 48
          description: number assigned to the application. applications are numbered serially for the court and affixed with the year.
          example: Application 1 of the year 2024
        issuedBy:
          $ref: '#/components/schemas/IssuedBy'
        status:
          type: string
          description: workflow status
        comment:
          type: array
          description: An array of comments representing the discussion between the parties of the case on this specific application.
          items:
            $ref: '#/components/schemas/Comment'
        isActive:
          type: boolean
          description: to handle soft delete
        reasonForApplication:
          type: string
          description: Reason For Application eg.- Reason for Rescheduling, Reason for Extension
        applicationDetails:
          type: object
          description: application schema
        statuteSection:
          $ref: '#/components/schemas/StatuteSection'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        additionalDetails:
          type: object
          description: >-
            Any extra fields that are not captured as first class fields can be
            stored here as key/value pairs. Implementation specific.
        auditDetails:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/AuditDetails"
        workflow:
          $ref: '#/components/schemas/WorkflowObject'

    ApplicationCriteria:
      type: object
      description: can send in any one of the values. If multiple parameters are passed, then it will be a logical AND search
      required:
        - tenantId
      properties:
        id:
          type: string
        cnrNumber:
          type: string
        filingNumber:
          type: string
        applicationType:
          type: string
        tenantId:
          type: string
        courtId:
          type: string
        onBehalfOf:
          type: array
          items:
            type: string
            format: uuid
        applicationNumber:
          type: string
        applicationCMPNumber:
          type: string
        owner:
          type: string
          format: uuid
          description: UUID of user
        status:
          type: string
        referenceId:
          type: string
        isFuzzySearch:
          type: boolean
          default: false
        isHideBailCaseBundle:
          type: boolean
          default: false
          description: "TODO: remove this, this is temporary fix (#5016)"
        asUser:
          type: string
        # NOTE: includePendingPayment is @JsonIgnore in the Java DTO (backend-only flag), so it is
        # intentionally not exposed on the wire and is omitted here.

    ApplicationExists:
      type: object
      description: can send in any one of the values and Exists value will be populated with true or false. If multiple parameters are passed, then it will be a logical AND search
      properties:
        filingNumber:
          type: string
        cnrNumber:
          type: string
        applicationNumber:
          type: string
        exists:
          type: boolean

    ApplicationAddComment:
      type: object
      properties:
        applicationNumber:
          type: string
          description: The application number for which the comment is being added
        comment:
          type: array
          description: An array of comments representing the discussion between the parties of the case on this specific application.
          items:
            $ref: '#/components/schemas/Comment'
        tenantId:
          type: string

    Comment:
      type: object
      required: [tenantId, individualId, comment]
      properties:
        id:
          type: string
          format: uuid
          description: This id is autogenerated id of the artifact. It is the primary key
          readOnly: true
        tenantId:
          type: string
          description: This is tenantId of the case based on the state.
        individualId:
          type: string
          description: The individual who is commenting on the artifact. In case lawyers do this on behalf of litigants, the individualId will be that of the litigant. The representative who's performing actions on behalf of will be captured in the audit details.
        comment:
          type: string
          description: Comments/responses from the user
          minLength: 2
          maxLength: 2048
        isActive:
          type: boolean
          description: Field to indicate soft delete of records
          default: true
        additionalDetails:
          type: object
          description: >-
            This field is meant to hold any extra information that we want to
            store for this entity.
        auditdetails:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/AuditDetails"

    IssuedBy:
      type: object
      properties:
        benchId:
          type: string
        judgeId:
          type: array
          items:
            type: string
            format: uuid
        courtId:
          type: string

    StatuteSection:
      type: object
      description: Holds the statute ID and the corresponding section & subsections applicable to the case.
      required:
        - tenantId
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          minLength: 2
          maxLength: 64
        statute:
          type: string
        sections:
          type: array
          items:
            type: string
        subsections:
          type: array
          items:
            type: string
        additionalDetails:
          type: object
        auditdetails:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/AuditDetails"
        strSections:
          type: string
        strSubsections:
          type: string

    Document:
      type: object
      properties:
        id:
          type: string
        documentType:
          type: string
        fileStore:
          type: string
        documentUid:
          type: string
        documentOrder:
          type: integer
          format: int64
        additionalDetails:
          type: object
        isActive:
          type: boolean
          default: true

    Pagination:
      type: object
      description: Pagination details
      properties:
        limit:
          type: number
          default: 10
          maximum: 100
        offSet:
          type: number
          default: 0
        totalCount:
          type: number
        sortBy:
          type: string
        order:
          type: string
          description: Sorting order
          enum: [asc, desc]

    WorkflowObject:
      description: >-
        Extends the common DIGIT Workflow contract with an application-specific
        additionalDetails object (org.pucar.dristi.web.models.WorkflowObject extends
        org.egov.common.contract.models.Workflow).
      allOf:
        - $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/Workflow"
        - type: object
          properties:
            additionalDetails:
              type: object
      # TODO: fields not fully expanded, verify base Workflow fields against org.egov.common.contract.models.Workflow
