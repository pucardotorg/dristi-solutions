openapi: 3.0.0

info:
  title: Hearing Management Service (Consolidated)
  description: >
    Consolidated APIs for court hearings in DRISTI. This spec merges endpoints
    from TWO distinct backend services that both implement hearing-related
    functionality today:
      * `hearing` (org.pucar.dristi, context-path `/hearing`) — the original/core
        hearing service. Operations are tagged `hearing`.
      * `hearing-management` (digit, context-path `/hearing-management`) — a newer,
        smaller hearing workflow/search service. Operations are tagged `hearing-management`.
    The two services define several same-named Java classes with different shapes
    (e.g. both have a `Hearing.java`, both have a `HearingCriteria.java`). Where the
    shapes differ, this spec gives them distinct schema names, suffixing the
    hearing-management variant with `HearingMgmt` (e.g. `Hearing` vs `HearingHearingMgmt`).
    Where the two services' classes are byte-for-byte identical in shape
    (e.g. `Attendee`, `PresidedBy`, `Pagination`, `Order`, `WorkflowObject`), a single
    shared schema is reused and its description notes it backs both services.
  version: 2.0.0

servers:
  - url: /
    description: >
      API Gateway root. Each service has its own Spring `server.servlet.context-path`
      (`/hearing` for the `hearing` service, `/hearing-management` for the
      `hearing-management` service). That context path is included directly in each
      path below (matching the convention already used in hearing-api-0.1.0.yaml),
      since the two services are not exposed under a single shared base path.

tags:
  - name: hearing
    description: Endpoints backed by the `hearing` service (backend/dristi-services/hearing).
  - name: hearing-management
    description: Endpoints backed by the `hearing-management` service (backend/dristi-services/hearing-management).
  - name: Hearings
    description: Core hearing CRUD / search.
  - name: Witness Depositions
    description: Witness deposition PDF generation and upload.
  - name: Bulk
    description: Bulk hearing operations.
  - name: Cause List
    description: Court cause list retrieval.
  - name: Current Hearing
    description: Live/in-progress hearing lookup.
  - name: Scheduling
    description: Cron-triggered hearing notification jobs.

security:
  - bearerAuth: []

paths:

  # ============================================================
  # hearing service (context-path: /hearing)
  # ============================================================

  /hearing/v1/create:
    post:
      tags: [hearing, Hearings]
      summary: Create hearing
      description: |
        Backed by `HearingApiController.hearingV1CreatePost`
        (`org.pucar.dristi.web.controllers.HearingApiController`).
        # REVIEW: reference specs previously documented this action at "/v1/_create"
        # (hearing-api.yaml) with no context path, and at "/hearing/v1/create"
        # (hearing-api-0.1.0.yaml). The actual Spring mapping today is
        # context-path "/hearing" + "/v1/create" (no underscore) — corrected here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingRequest'
      responses:
        '200':
          description: Hearing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingResponse'

  /hearing/v1/update:
    post:
      tags: [hearing, Hearings]
      summary: Update hearing
      description: |
        Backed by `HearingApiController.hearingV1UpdatePost`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingRequest'
      responses:
        '200':
          description: Hearing updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingResponse'

  /hearing/v1/search:
    post:
      tags: [hearing, Hearings]
      summary: Search hearings
      description: |
        Backed by `HearingApiController.hearingV1SearchPost`. Returns
        `HearingListResponse`, NOT the generic `HearingSearchResponse` used
        by the newer `hearing-api.yaml` — that schema shape does not match
        this endpoint's actual response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingSearchRequest'
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingListResponse'

  /hearing/v1/exists:
    post:
      tags: [hearing, Hearings]
      summary: Check hearing exists
      description: |
        Backed by `HearingApiController.hearingV1ExistsPost`. Despite the name,
        the request/response wrapper field is `order` (of type `HearingExists`),
        matching `HearingExistsRequest.java` / `HearingExistsResponse.java` exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingExistsRequest'
      responses:
        '200':
          description: Exists result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingExistsResponse'

  /hearing/v1/update/time:
    post:
      tags: [hearing, Hearings]
      summary: Update hearing start and end time (bulk)
      description: |
        Backed by `HearingApiController.hearingV1UpdateTimePost`. Note: despite the
        singular name, both `UpdateTimeRequest` and `UpdateTimeResponse` carry a
        `hearings` ARRAY, not a single hearing/time pair — corrected from the
        newer hearing-api.yaml, which incorrectly modeled this as a single
        hearingId/startTime/endTime request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTimeRequest'
      responses:
        '200':
          description: Time updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTimeResponse'

  /hearing/v1/update_transcript_additional_attendees:
    post:
      tags: [hearing, Hearings]
      summary: Update hearing transcript and additional attendees
      description: |
        Backed by `HearingApiController.hearingV1UpdateHearingTranscriptAdditionAuditDetailsPost`.
        # REVIEW: hearing-api-0.1.0.yaml documented a similarly-purposed but
        # differently-named endpoint "/hearing/v1/updateTranscript" which no longer
        # exists in the controller. This endpoint (a different path) appears to be
        # its replacement based on naming/behavior, but this is an inference, not
        # a verified rename — flagging for confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingRequest'
      responses:
        '200':
          description: Hearing transcript / additional attendees updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingResponse'

  /hearing/witnessDeposition/v1/downloadPdf:
    post:
      tags: [hearing, Witness Depositions]
      summary: Download witness deposition PDF
      description: |
        Backed by `HearingApiController.witnessDepositionV1DownloadPdf`. Not present
        in either reference yaml — newly added. Returns a raw PDF byte stream, not JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingSearchRequest'
      responses:
        '200':
          description: Witness deposition PDF file
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="witness_deposition_pdf.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /hearing/witnessDeposition/v1/uploadPdf:
    post:
      tags: [hearing, Witness Depositions]
      summary: Upload witness deposition (signed) PDF
      description: |
        Backed by `HearingApiController.witnessDepositionV1UploadPdf`. Not present
        in either reference yaml — newly added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingRequest'
      responses:
        '200':
          description: Hearing updated with uploaded witness deposition document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingResponse'

  /hearing/v1/close-payment-pending-tasks:
    post:
      tags: [hearing]
      summary: Close active payment-pending tasks for a hearing
      description: |
        Backed by `HearingApiController.closeActivePaymentPendingTasks`. Not present
        in either reference yaml — newly added. Response body is the bare
        `ResponseInfo` object (no wrapper), matching the controller's return type
        `ResponseEntity<ResponseInfo>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingRequest'
      responses:
        '200':
          description: Payment pending tasks closed
          content:
            application/json:
              schema:
                $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"

  /hearing/v1/bulk/_reschedule:
    post:
      tags: [hearing, Bulk]
      summary: Bulk reschedule hearings for a judge/court/time-slot
      description: |
        Backed by `HearingApiController.bulkRescheduleHearing`. Not present in either
        reference yaml — newly added. Controller returns HTTP 202 (Accepted),
        not 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRescheduleRequest'
      responses:
        '202':
          description: Bulk reschedule request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRescheduleResponse'

  /hearing/v1/bulk/_update:
    post:
      tags: [hearing, Bulk]
      summary: Bulk update hearings
      description: |
        Backed by `HearingApiController.bulkUpdateHearings`. Not present in either
        reference yaml — newly added. Controller returns HTTP 202 (Accepted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingUpdateBulkRequest'
      responses:
        '202':
          description: Bulk update accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingUpdateBulkResponse'

  /hearing/v1/getNoOfDaysToHearing:
    post:
      tags: [hearing]
      summary: Get average number of days to hearing, per case
      description: |
        Backed by `HearingApiController.getNoOfDaysToHearing`. Not present in either
        reference yaml — newly added. Despite being a POST with a `HearingRequest`
        body, the service method `getAvgNoOfDaysToHearingForEachCase()` takes no
        arguments from the body in the current implementation.
        # REVIEW: request body is accepted but appears unused by the service call;
        # verify whether requestInfo is consumed elsewhere (e.g. via interceptor).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingRequest'
      responses:
        '200':
          description: List of average number of days to hearing, one entry per case
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int32

  /hearing/v1/_runCronJob:
    post:
      tags: [hearing, Scheduling]
      summary: Manually trigger hearing-notification cron jobs
      description: |
        Backed by `HearingApiController.runCronJob`. Not present in either reference
        yaml — newly added. Triggers `sendNotificationOnHearingsHeldToday()` and
        `sendNotificationForHearingsScheduledTomorrow()`. No request body is bound.
        # REVIEW: controller returns `ResponseEntity<?>` with HttpStatus.OK and no
        # body — no response schema exists in code to document.
      responses:
        '200':
          description: Cron jobs triggered successfully (no response body in code)

  /hearing/v1/cause-list:
    post:
      tags: [hearing, Cause List]
      summary: Get court cause list
      description: |
        Backed by `HearingApiController.getCauseList`. Not present in either
        reference yaml — newly added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CauseListRequest'
      responses:
        '200':
          description: Cause list result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CauseListResponse'

  /hearing/v1/current-hearing:
    post:
      tags: [hearing, Current Hearing]
      summary: Get the currently in-progress hearing for a court
      description: |
        Backed by `HearingApiController.getCurrentHearing`. Not present in either
        reference yaml — newly added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentHearingRequest'
      responses:
        '200':
          description: Current hearing status/details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentHearingResponse'

  # ============================================================
  # hearing-management service (context-path: /hearing-management)
  # ============================================================

  /hearing-management/hearing/v1/search:
    post:
      tags: [hearing-management, Hearings]
      summary: Search hearings (day-grouped calendar view)
      description: |
        Backed by `HearingApiController.hearingV1SearchPost`
        (`digit.web.controllers.HearingApiController`). Unlike the `hearing`
        service's `/hearing/v1/search`, this returns hearings GROUPED BY DAY
        (`HearingSearchListResponse.HearingList` is an array of
        `HearingSearchResponse`, one per date, each containing its own
        `hearingList` of slim per-hearing summaries) rather than a flat list of
        full `Hearing` objects. This is the ONLY endpoint currently implemented
        by the `hearing-management` service (its controller has a single method).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HearingSearchRequestHearingMgmt'
      responses:
        '200':
          description: Search result, grouped by hearing date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingSearchListResponse'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ---------- hearing service: request/response wrappers ----------

    HearingRequest:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.HearingRequest`.
      required: [hearing]
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        hearing:
          $ref: '#/components/schemas/Hearing'

    HearingResponse:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.HearingResponse`.
      properties:
        responseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        hearing:
          $ref: '#/components/schemas/Hearing'

    HearingSearchRequest:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.HearingSearchRequest` (hearing service).
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        criteria:
          $ref: '#/components/schemas/HearingCriteria'
        pagination:
          $ref: '#/components/schemas/Pagination'

    HearingListResponse:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.HearingListResponse` (hearing service).
      properties:
        responseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        TotalCount:
          type: integer
          format: int32
        HearingList:
          type: array
          items:
            $ref: '#/components/schemas/Hearing'

    HearingExistsRequest:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.HearingExistsRequest`.
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        order:
          $ref: '#/components/schemas/HearingExists'

    HearingExistsResponse:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.HearingExistsResponse`.
      properties:
        responseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        order:
          $ref: '#/components/schemas/HearingExists'

    HearingExists:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.HearingExists`.
      properties:
        hearingId:
          type: string
        filingNumber:
          type: string
        cnrNumber:
          type: string
        applicationNumber:
          type: string
        exists:
          type: boolean

    UpdateTimeRequest:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.UpdateTimeRequest`.
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        hearings:
          type: array
          items:
            $ref: '#/components/schemas/Hearing'

    UpdateTimeResponse:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.UpdateTimeResponse`.
      properties:
        ResponseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        hearings:
          type: array
          items:
            $ref: '#/components/schemas/Hearing'

    BulkRescheduleRequest:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.BulkRescheduleRequest`.
      required: [RequestInfo, BulkReschedule]
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        BulkReschedule:
          $ref: '#/components/schemas/BulkReschedule'

    BulkReschedule:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.BulkReschedule`.
      required: [judgeId, courtId, startTime, endTime, tenantId, scheduleAfter]
      properties:
        judgeId:
          type: string
        courtId:
          type: string
        startTime:
          type: integer
          format: int64
          description: Epoch millis.
        endTime:
          type: integer
          format: int64
          description: Epoch millis.
        tenantId:
          type: string
        slotIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int32
        hearingIds:
          type: array
          items:
            type: string
        searchableFields:
          type: string
        scheduleAfter:
          type: integer
          format: int64
          description: Epoch millis.

    BulkRescheduleResponse:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.BulkRescheduleResponse`.
      properties:
        ResponseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        Hearings:
          type: array
          description: JSON key is "Hearings" per @JsonProperty, even though the Java field is named `reScheduleHearings`.
          items:
            $ref: '#/components/schemas/ScheduleHearing'

    ScheduleHearing:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.ScheduleHearing`.
      properties:
        hearingBookingId:
          type: string
        tenantId:
          type: string
        courtId:
          type: string
        judgeIds:
          type: array
          items:
            type: string
        caseId:
          type: string
        filingNumber:
          type: array
          items:
            type: string
        hearingType:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        hearingDate:
          type: integer
          format: int64
          description: Epoch millis (primitive long in code).
        startTime:
          type: integer
          format: int64
          description: Epoch millis (primitive long in code).
        endTime:
          type: integer
          format: int64
          description: Epoch millis (primitive long in code).
        originalHearingDate:
          type: integer
          format: int64
          description: Epoch millis (primitive long in code).
        expiryTime:
          type: integer
          format: int64
          nullable: true
          description: Epoch millis.
        auditDetails:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/AuditDetails"
          description: >
            Java field type is `digit.models.coremodels.AuditDetails`, a different
            class from the `org.egov.common.contract.models.AuditDetails` used
            elsewhere in this spec, but structurally identical
            (createdBy/lastModifiedBy/createdTime/lastModifiedTime) — reused here
            rather than duplicated.
        rowVersion:
          type: integer
          format: int32
          nullable: true
        caseStage:
          type: string

    HearingUpdateBulkRequest:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.HearingUpdateBulkRequest`.
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        hearings:
          type: array
          items:
            $ref: '#/components/schemas/Hearing'

    HearingUpdateBulkResponse:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.HearingUpdateBulkResponse`.
      properties:
        ResponseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        hearings:
          type: array
          items:
            $ref: '#/components/schemas/Hearing'

    CauseListRequest:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.CauseListRequest`.
      required: [courtId, date]
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        courtId:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Format yyyy-MM-dd (validated by @Pattern in code, NOT an epoch millis field).
        offset:
          type: integer
          format: int32
          minimum: 0
          default: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 300
          default: 100
        status:
          type: string
        hearingType:
          type: string
        searchableFields:
          type: string

    CauseListResponse:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.CauseListResponse`.
      properties:
        ResponseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        hearings:
          type: array
          description: >
            Java type is `List<Map<String, Object>>` (a raw/dynamic projection built
            by the service layer, not a fixed DTO) — modeled here as free-form objects.
          items:
            type: object
            additionalProperties: true
        totalCount:
          type: integer
          format: int32

    CurrentHearingRequest:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.CurrentHearingRequest`.
      required: [courtId]
      properties:
        RequestInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo"
        courtId:
          type: string
        currentHearingNumber:
          type: string

    CurrentHearingResponse:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.CurrentHearingResponse`.
      properties:
        ResponseInfo:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo"
        sessionStatus:
          type: string
        currentHearingKey:
          type: string
        nextHearing:
          $ref: '#/components/schemas/NextHearingInfo'
        hearingData:
          type: object
          additionalProperties: true
          description: Java type is `Map<String, Object>` (free-form).

    NextHearingInfo:
      type: object
      description: Wire format per `org.pucar.dristi.web.models.NextHearingInfo`.
      properties:
        hearingNumber:
          type: string
        caseId:
          type: string
        filingNumber:
          type: string
        fromDate:
          type: integer
          format: int64
          description: Epoch millis.

    # ---------- hearing service: domain objects ----------

    Hearing:
      type: object
      description: >
        Wire format per `org.pucar.dristi.web.models.Hearing` (hearing service).
        Distinct from `HearingHearingMgmt` — the hearing-management service's
        version of this class lacks `hearingDurationInMillis` and its `documents`
        field uses the common-contract `Document` shape (no `isActive`) instead
        of this service's local `Document` shape.
      required: [tenantId, hearingType, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        hearingId:
          type: string
          minLength: 2
          maxLength: 64
        courtCaseNumber:
          type: string
        caseReferenceNumber:
          type: string
        cmpNumber:
          type: string
        filingNumber:
          type: array
          items:
            type: string
        cnrNumbers:
          type: array
          items:
            type: string
        applicationNumbers:
          type: array
          items:
            type: string
        hearingType:
          type: string
        status:
          type: string
        startTime:
          type: integer
          format: int64
          nullable: true
          description: Epoch millis.
        endTime:
          type: integer
          format: int64
          nullable: true
          description: Epoch millis.
        presidedBy:
          $ref: '#/components/schemas/PresidedBy'
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/Attendee'
        transcript:
          type: array
          items:
