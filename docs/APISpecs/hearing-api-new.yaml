        auditDetails:
          $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/AuditDetails"
        workflow:
          $ref: '#/components/schemas/WorkflowObject'
        notes:
          type: string
        hearingSummary:
          type: string
        hearingDurationInMillis:
          type: integer
          format: int64

    HearingCriteria:
      type: object
      description: >
        Wire format per `org.pucar.dristi.web.models.HearingCriteria` (hearing
        service). Distinct from `HearingCriteriaHearingMgmt`, which lacks the
        `status` field.
      properties:
        hearingId:
          type: string
        hearingType:
          type: string
        cnrNumber:
          type: string
        filingNumber:
          type: string
        tenantId:
          type: string
        applicationNumber:
          type: string
        fromDate:
          type: integer
          format: int64
          description: Epoch millis.
        toDate:
          type: integer
          format: int64
          description: Epoch millis.
        attendeeIndividualId:
          type: string
        courtId:
          type: string
        status:
          type: string

    Document:
      type: object
      description: >
        Wire format per `org.pucar.dristi.web.models.Document` (hearing service's
        own local class — NOT the DIGIT common-contract Document). Includes
        `isActive`, which `DocumentCommonContract` does not have.
      properties:
        id:
          type: string
        documentType:
          type: string
        fileStore:
          type: string
        documentUid:
          type: string
        additionalDetails:
          type: object
          additionalProperties: true
          description: Java type is `Object` (free-form).
        isActive:
          type: boolean
          default: true

    # ---------- shared between hearing and hearing-management (identical shape) ----------

    Attendee:
      type: object
      description: >
        Wire format per `Attendee.java`. Identical field-for-field in both the
        `hearing` and `hearing-management` services — shared here.
      properties:
        id:
          type: string
        name:
          type: string
        individualId:
          type: string
        type:
          type: string
        associatedWith:
          type: string
        wasPresent:
          type: boolean
        isOnline:
          type: boolean

    PresidedBy:
      type: object
      description: >
        Wire format per `PresidedBy.java`. Identical field-for-field in both the
        `hearing` and `hearing-management` services — shared here.
      required: [judgeID, courtID]
      properties:
        benchID:
          type: string
        judgeID:
          type: array
          minItems: 1
          items:
            type: string
        courtID:
          type: string

    Pagination:
      type: object
      description: >
        Wire format per `Pagination.java`. Identical field-for-field in both the
        `hearing` and `hearing-management` services — shared here.
      properties:
        limit:
          type: number
          maximum: 100
          default: 10
        offSet:
          type: number
          default: 0
        totalCount:
          type: number
        sortBy:
          type: string
        order:
          $ref: '#/components/schemas/Order'

    Order:
      type: string
      description: >
        Wire format per `Order.java` enum. Identical in both the `hearing` and
        `hearing-management` services — shared here. Jackson serializes the
        lowercase `@JsonValue`, not the enum constant name.
      enum: [asc, desc]

    WorkflowObject:
      type: object
      description: >
        Wire format per `WorkflowObject.java`, which extends
        `org.egov.common.contract.models.Workflow` and adds `additionalDetails`.
        Identical in both the `hearing` and `hearing-management` services — shared
        here. Note: `documents` here uses the common-contract `Document` shape
        (`DocumentCommonContract`, no `isActive`), which differs from the
        `Document` shape used directly on `Hearing.documents` in the `hearing`
        service.
      properties:
        action:
          type: string
        comments:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentCommonContract'
        assignes:
          type: array
          items:
            type: string
        rating:
          type: integer
          format: int32
        additionalDetails:
          type: object
          additionalProperties: true
          description: Java type is `Object` (free-form).

    DocumentCommonContract:
      type: object
      description: >
        Wire format per `org.egov.common.contract.models.Document` (the shared
        DIGIT common-contract library class, resolved from the `services-common`
        Maven dependency — NOT this spec's local `Document` schema). Used by
        `WorkflowObject.documents` in both services, and directly by
        `HearingHearingMgmt.documents` in the hearing-management service. Unlike
        the local `Document` schema, it has no `isActive` field.
      properties:
        id:
          type: string
        documentType:
          type: string
        fileStore:
          type: string
        documentUid:
          type: string
        additionalDetails:
          type: object
          additionalProperties: true
          description: Java type is `Object` (free-form).

