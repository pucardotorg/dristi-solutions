openapi: 3.0.0

info:
  title: Case and Witness Registry
  description: >
    APIs for managing court cases, witnesses, join-case flows, advocate/office
    case membership and related entities. Regenerated against the actual
    CaseApiController implementation (org.pucar.dristi.web.controllers.CaseApiController)
    and the request/response DTOs it references, as of 2026-07-25.
  version: 3.0.0

servers:
  - url: /case

tags:
  - name: Case
  - name: JoinCase
  - name: Witness
  - name: Address
  - name: Profile
  - name: AdvocateOffice
  - name: OpenApi
  - name: Utilities

security:
  - bearerAuth: []

paths:

  # -------------------------------------------------------------------------
  # CASE CRUD / LIFECYCLE
  # -------------------------------------------------------------------------

  /v1/_create:
    post:
      tags: [Case]
      summary: Create a new case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseRequest'
      responses:
        '200':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'

  /v1/_update:
    post:
      tags: [Case]
      summary: Update case (goes through workflow transition)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseRequest'
      responses:
        '200':
          description: Case updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'

  /v2/_update:
    post:
      tags: [Case]
      summary: Update case attributes without triggering a workflow transition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseRequest'
      responses:
        '200':
          description: Case updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'

  /v1/admin/edit_case:
    post:
      tags: [Case]
      summary: Admin edit of a small set of case fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseRequest'
      responses:
        '200':
          description: Case edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'

  /v1/_updateLPRDetails:
    post:
      tags: [Case]
      summary: Update Long Pending Referral (LPR) details on a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseRequest'
      responses:
        '200':
          description: Case updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'

  /v1/_exists:
    post:
      tags: [Case]
      summary: Check whether one or more cases exist, by tenantId/caseId/cnrNumber/filingNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseExistsRequest'
      responses:
        '200':
          description: Exists response, one entry per input criteria item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseExistsResponse'

  /v1/_search:
    post:
      tags: [Case]
      summary: Search cases (v1). NOTE - response echoes back the input criteria list, not enriched case objects.
      description: >
        The service call (caseService.searchCases) has a void-ish contract in the current
        controller implementation - it is invoked for its side effects (e.g. populating
        criteria[].responseList) and the controller then returns the same criteria list
        it received on the request, now populated by the service. See CaseCriteria.responseList.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'

  /v1/_count:
    post:
      tags: [Case]
      summary: Get count of cases matching search criteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSearchRequest'
      responses:
        '200':
          description: Matching case count
          content:
            application/json:
              schema:
                type: integer
                format: int32

  /v1/_generatePdf:
    post:
      tags: [Utilities]
      summary: Generate case PDF for the searched case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSearchRequest'
      responses:
        '200':
          description: PDF generation triggered; returns the case wrapped like a normal CaseResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'

  /v1/casemeta/_search:
    post:
      tags: [Case]
      summary: Lightweight, scalar-only case metadata lookup by filingNumbers
      description: >
        Resolves one or more filingNumbers to their scalar case metadata sourced directly
        from the dristi_cases table (single table, no joins, no Redis cache, no enc-service
        decryption). Intended for internal callers needing identifiers without the cost of
        a full /v1/_search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseMetaRequest'
      responses:
        '200':
          description: Case metadata list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMetaResponse'

  /v2/search/details:
    post:
      tags: [Case]
      summary: Get full case details (v2) for a single case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSearchRequestV2'
      responses:
        '200':
          description: Case details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSearchResponseV2'

  /v2/search/list:
    post:
      tags: [Case]
      summary: Search for a paginated list of case summaries (v2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSummaryListRequest'
      responses:
        '200':
          description: Paginated list of case summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummaryListResponse'

  /v2/search/summary:
    post:
      tags: [Case]
      summary: Search cases by CNR/case/CMP number text, returns lightweight case summaries (v2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSummarySearchRequest'
      responses:
        '200':
          description: Matching case summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummarySearchResponse'

  /v1/search/_summary:
    post:
      tags: [Case]
      summary: Search cases, returning only public-safe fields (unauthenticated-caller-friendly)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSummaryRequest'
      responses:
        '200':
          description: Case summaries with pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummaryResponse'

  /v1/search/caseSearchText:
    post:
      tags: [Case]
      summary: Search cases by free text against CNR, case number, filing number, CMP number etc.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSearchTextRequest'
      responses:
        '200':
          description: Matching case identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSearchTextResponse'

  # -------------------------------------------------------------------------
  # OPEN API (external, unauthenticated-flavoured, RequestInfo not required in body)
  # -------------------------------------------------------------------------

  /v1/search/cnrNumber:
    post:
      tags: [OpenApi]
      summary: Look up a case summary by CNR number (external/open API)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenApiCaseSummaryRequest'
      responses:
        '200':
          description: Case summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiCaseSummaryResponse'

  /v1/search/caseNumber:
    post:
      tags: [OpenApi]
      summary: Look up a case summary by case number (external/open API)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenApiCaseSummaryRequest'
      responses:
        '200':
          description: Case summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiCaseSummaryResponse'

  /v1/search/caseType:
    post:
      tags: [OpenApi]
      summary: List cases of a given case type/year (external/open API)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenApiCaseSummaryRequest'
      responses:
        '200':
          description: List of matching cases (lightweight line items)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiCaseListResponse'

  # -------------------------------------------------------------------------
  # JOIN CASE
  # -------------------------------------------------------------------------

  /v1/_verify:
    post:
      tags: [JoinCase]
      summary: Verify a join-case request (v1, legacy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCaseRequest'
      responses:
        '200':
          description: Verification result; echoes back the join case request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinCaseResponse'

  /v1/joincase/_joincase:
    post:
      tags: [JoinCase]
      summary: Litigants, representatives or POA holders join an existing case (v2 flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCaseV2Request'
      responses:
        '200':
          description: Join case processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinCaseV2Response'

  /v2/joincase/_verifycode:
    post:
      tags: [JoinCase]
      summary: Verify that the access code supplied to join a case matches the case's code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCodeRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCodeResponse'

  /enrich/access-code:
    post:
      tags: [JoinCase]
      summary: Enrich/generate access codes for a list of filing numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessCodeGenerateRequest'
      responses:
        '200':
          description: Map of filingNumber to a boolean flag (whether access code enrichment succeeded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCodeGenerateResponse'

  # -------------------------------------------------------------------------
  # WITNESS
  # -------------------------------------------------------------------------

  /v1/add/witness:
    post:
      tags: [Witness]
      deprecated: true
      summary: (Deprecated) Add a witness to a case by filing number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWitnessRequest'
      responses:
        '200':
          description: Witness add acknowledged; echoes back the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddWitnessResponse'

  /v2/add/witness:
    post:
      tags: [Witness]
      summary: Add one or more rich witness-detail records to a case (v2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WitnessDetailsRequest'
      responses:
        '200':
          description: Witness details added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WitnessDetailsResponse'

  /witness/v1/_create:
    post:
      tags: [Witness]
      summary: Register a witness against a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WitnessRequest'
      responses:
        '200':
          description: Witness created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WitnessResponse'

  /witness/v1/_update:
    post:
      tags: [Witness]
      summary: Update (or soft-delete via isActive) a witness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WitnessRequest'
      responses:
        '200':
          description: Witness updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WitnessResponse'

  /witness/v1/_search:
    post:
      tags: [Witness]
      summary: Search for witnesses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WitnessSearchRequest'
      responses:
        '200':
          description: Matching witnesses (empty array if none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WitnessResponse'

  # -------------------------------------------------------------------------
  # ADDRESS
  # -------------------------------------------------------------------------

  /v1/address/_add:
    post:
      tags: [Address]
      summary: Add or update addresses for one or more parties in a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAddressRequest'
      responses:
        '200':
          description: Addresses added/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAddressResponse'

  # -------------------------------------------------------------------------
  # PROFILE (litigant / respondent profile edit requests)
  # -------------------------------------------------------------------------

  /v2/profilerequest/create:
    post:
      tags: [Profile]
      summary: Create a litigant/respondent profile edit request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '200':
          description: Case with pending profile edit request recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'

  /v2/profilerequest/process:
    post:
      tags: [Profile]
      summary: Approve or reject a pending profile edit request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessProfileRequest'
      responses:
        '200':
          description: Case updated as a result of processing the profile request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'

  # -------------------------------------------------------------------------
  # ADVOCATE / ADVOCATE-OFFICE
  # -------------------------------------------------------------------------

  /v1/advocate/_cases:
    post:
      tags: [AdvocateOffice]
      summary: Get the list of cases (caseId + filingNumber) an advocate is associated with
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvocateCasesRequest'
      responses:
        '200':
          description: Cases for the advocate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvocateCasesResponse'

  /v1/member/_advocates:
    post:
      tags: [AdvocateOffice]
      summary: Get the office-advocate UUIDs a given office member (clerk/associate advocate) belongs under, for a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAdvocatesRequest'
      responses:
        '200':
          description: List of advocate UUIDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberAdvocatesResponse'

  /v1/_searchCaseMember:
    post:
      tags: [AdvocateOffice]
      summary: Search cases assigned/unassigned to an advocate-office member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseMemberSearchRequest'
      responses:
        '200':
          description: Matching cases with pagination and total count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMemberSearchResponse'

  /v1/_processCaseMember:
    post:
      tags: [AdvocateOffice]
      summary: Assign or remove case access for an advocate-office member (clerk/associate advocate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessCaseMemberRequest'
      responses:
        '200':
          description: Processed case member details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessCaseMemberResponse'

  # -------------------------------------------------------------------------
  # UTILITIES
  # -------------------------------------------------------------------------

  /v1/_runCronJob:
    post:
      tags: [Utilities]
      summary: Manually trigger the case-reassignment notification cron job
      description: No request body. Returns an empty 200 response (no response body is written by the controller).
      responses:
        '200':
          description: Cron job triggered

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # =========================================================================
    # COMMON / SHARED
    # =========================================================================

    Pagination:
      description: Local Pagination model (org.pucar.dristi.web.models.Pagination) - NOT the DIGIT-OSS common-contract Pagination, field names differ (offSet not offset).
      type: object
      properties:
        limit:
          type: integer
          format: int32
          default: 10
          maximum: 100
        offSet:
          type: integer
          format: int32
          default: 0
        totalCount:
          type: number
          format: double
        sortBy:
          type: string
        order:
          $ref: '#/components/schemas/Order'

    Order:
      type: string
      enum: [asc, desc]

    Document:
      type: object
      properties:
        id:
          type: string
        documentType:
          type: string
        fileName:
          type: string
        documentName:
          type: string
        fileStore:
          type: string
        toDelete:
          type: boolean
          default: false
        documentUid:
          type: string
        isActive:
          type: boolean
          default: true
        additionalDetails:
          type: object

    Address:
      description: org.pucar.dristi.web.models.Address - used by /v1/address/_add (PartyAddressRequest.addresses)
      type: object
      properties:
        id:
          type: string
        doorNo:
          type: string
        street:
          type: string
        landmark:
          type: string
        city:
          type: string
        pincode:
          type: string
        locality:
          type: string
        district:
          type: string
        state:
          type: string
        country:
          type: string
        typeOfAddress:
          $ref: '#/components/schemas/AddressType'
        coordinates:
          $ref: '#/components/schemas/Coordinates'

    AddressType:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        code:
          type: string
        isActive:
          type: boolean

    Coordinates:
      type: object
      properties:
        latitude:
          type: string
        longitude:
          type: string

    NatureOfDisposal:
      type: string
      enum: [CONTESTED, UNCONTESTED]

    LifecycleStatus:
      type: string
      enum: [ACTIVE, LPR]

    MemberType:
      type: string
      enum: [ADVOCATE, ADVOCATE_CLERK]

    ActionType:
      type: string
      enum: [ACCEPT, REJECT]

    CaseMappingFilterStatus:
      type: string
      enum: [ALL_CASES, ASSIGNED_CASES, UNASSIGNED_CASES]

    # =========================================================================
    # CASE - CORE DOMAIN MODEL
    # =========================================================================

    CourtCase:
      description: org.pucar.dristi.web.models.CourtCase
      type: object
      required:
        - tenantId
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        resolutionMechanism:
          type: string
          example: COURT, ADR.MEDIATION, ADR.CONCILIATION, ODR.ARBITRATION
        caseTitle:
          type: string
        isActive:
          type: boolean
          default: true
        caseDescription:
          type: string
        filingNumber:
          type: string
          example: KL-000001-2024
        advocateCount:
          type: integer
          format: int32
        courtCaseNumber:
          type: string
          example: CC/023443/2024 OR ST/1/2024
        caseNumber:
          type: string
        caseType:
          type: string
        cnrNumber:
          type: string
          example: PBJL01-123556-2024
        cmpNumber:
          type: string
          example: CMP/1/2024
        accessCode:
          type: string
          description: Case access code enabling anyone to join & access the case details.
        outcome:
          type: string
        natureOfDisposal:
          $ref: '#/components/schemas/NatureOfDisposal'
        pendingAdvocateRequests:
          type: array
          items:
            $ref: '#/components/schemas/PendingAdvocateRequest'
        courtId:
          type: string
          example: KLKM52
        benchId:
          type: string
        linkedCases:
          type: array
          items:
            $ref: '#/components/schemas/LinkedCase'
        filingDate:
          type: integer
          format: int64
          description: Epoch millis. Date the case entered the judicial system.
        registrationDate:
          type: integer
          format: int64
        judgementDate:
          type: integer
          format: int64
        caseDetails:
          type: object
          description: Case-type specific details, structure varies by caseCategory.
        caseCategory:
          type: string
          example: CIVIL, CRIMINAL
        judgeId:
          type: string
        stage:
          type: string
        natureOfPleading:
          type: string
          example: Original Suit, Complaint, Interim Application, First Appeal, Second Appeal, Review, Revision, Reference
        statutesAndSections:
          type: array
          items:
            $ref: '#/components/schemas/StatuteSection'
        litigants:
          type: array
          items:
            $ref: '#/components/schemas/Party'
        representatives:
          type: array
          items:
            $ref: '#/components/schemas/AdvocateMapping'
        advocateOffices:
          type: array
          items:
            $ref: '#/components/schemas/AdvocateOffice'
        status:
          type: string
          description: Current status of the case, pulled from the Workflow service.
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        remarks:
          type: string
        workflow:
          $ref: '#/components/schemas/WorkflowObject'
        additionalDetails:
          type: object
        auditDetails:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/AuditDetails'
        advocateStatus:
          type: string
        poaHolders:
          type: array
          items:
            $ref: '#/components/schemas/POAHolder'
        witnessDetails:
          type: array
          items:
            $ref: '#/components/schemas/WitnessDetails'
        advocateDetailBlock:
          type: array
          items:
            $ref: '#/components/schemas/AdvocateDetailBlock'
        lprNumber:
          type: string
        lifecycleStatus:
          allOf:
            - $ref: '#/components/schemas/LifecycleStatus'
          default: ACTIVE
        courtCaseNumberBackup:
          type: string
        secondaryStage:
          type: array
          items:
            type: string

    PendingAdvocateRequest:
      type: object
      properties:
        advocateId:
          type: string
        status:
          type: string
          description: PENDING or PARTIALLY JOINED (free string in code, historically enum-like)
        taskReferenceNoList:
          type: array
          items:
            type: string
        individualDetails:
          $ref: '#/components/schemas/IndividualDetails'

    IndividualDetails:
      type: object
      required: [individualId, advocateIdProof]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        individualId:
          type: string
        advocateIdProof:
          type: array
          items:
            $ref: '#/components/schemas/AdvocateIdProof'

    AdvocateIdProof:
      type: object
      required: [name, fileName, fileStore]
      properties:
        name:
          type: string
        fileName:
          type: string
        fileStore:
          type: string
        documentName:
          type: string

    LinkedCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        relationshipType:
          type: string
          example: PARENT, CHILD, PRIOR_APPEAL
        caseNumber:
          type: string
        referenceUri:
          type: string
        isActive:
          type: boolean
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        additionalDetails:
          type: object
        auditdetails:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/AuditDetails'

    StatuteSection:
