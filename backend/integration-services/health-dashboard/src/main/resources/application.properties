server.context-path=/health-dashboard
server.servlet.context-path=/health-dashboard
server.port=8080

app.timezone=GMT+5:30

#OTEL CONFIGURATION
otel.traces.exporter=otlp
otel.service.name=health-dashboard
otel.logs.exporter=none
otel.metrics.exporter=none
otel.exporter.otlp.endpoint=http://jaeger-collector.tracing:4318
otel.exporter.otlp.protocol=http/protobuf
otel.instrumentation.http.server.ignore-urls=/health-dashboard/health,/health-dashboard/prometheus

#DATABASE CONFIGURATION
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/health
spring.datasource.username=postgres
spring.datasource.password=root

#FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#HEALTH CHECK SCHEDULER
# Runs every 30 minutes (seconds minutes hours day month weekday)
health.check.cron=0 0/15 * * * *
# Runs every 10 seconds (seconds minutes hours day month weekday)
#health.check.cron=*/10 * * * * *
health.check.timeout.ms=10000

#THIRD-PARTY SERVICE ENDPOINTS
esign.tcp.host=esignservice.cdac.in
esign.tcp.port=443

sms.http.url=https://msdgweb.mgov.gov.in/esms/sendsmsrequestDLT

treasury.http.url=https://etreasury.kerala.gov.in/

icops.tcp.host=api-icops.keralapolice.gov.in
icops.tcp.port=443

#KAFKA CONSUMER CONFIGURATION
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=health-dashboard
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

kafka.topics.health.status=egov.health.status

#ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

#LOGGING
logging.loki.enabled=false
logging.loki.url=http://localhost:3100/loki/api/v1/push
logging.loki.app=health-dashboard
logging.loki.environment=local
logging.level.root=INFO